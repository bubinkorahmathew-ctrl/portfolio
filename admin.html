<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | BKM Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
    <!-- Background Effects -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <!-- Login Container -->
    <div id="login-container" class="admin-auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <div class="auth-icon-circle">
                    <i class="fas fa-lock pulse-icon"></i>
                </div>
                <h2>Admin Access</h2>
                <p>Secure login for BKM Portfolio Dashboard</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" required placeholder="••••••••">
                        <button type="button" id="toggle-password" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" id="login-submit" class="btn btn-primary w-100">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader hidden">
                        <i class="fas fa-circle-notch fa-spin"></i>
                    </span>
                </button>
                <div class="auth-footer">
                    <a href="index.html" class="back-link">
                        <i class="fas fa-arrow-left"></i> Back to Website
                    </a>
                </div>
            </form>
            <p id="auth-error" class="error-msg"></p>
            <div class="demo-login-box">
                <div class="demo-info">
                    <span class="demo-label">Demo Access:</span>
                    <code>admin@example.com</code> / <code>password</code>
                </div>
                <button type="button" id="fill-demo" class="btn btn-secondary btn-sm w-100">
                    <i class="fas fa-magic"></i> Use Default Login
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard Container (Hidden by default) -->
    <div id="dashboard-container" class="dashboard-container hidden">
        <header class="dashboard-header glass-card">
            <div class="header-left">
                <h1>Control Center</h1>
                <span class="user-email" id="user-email"></span>
            </div>
            <div class="header-right">
                <button id="logout-btn" class="btn btn-secondary btn-sm">Sign Out</button>
            </div>
        </header>

        <main class="dashboard-main">
            <section class="db-section">
                <div class="section-header">
                    <h2>Manage Projects</h2>
                    <button class="btn btn-primary btn-sm" onclick="openModal()">
                        <i class="fas fa-plus"></i> New Project
                    </button>
                </div>
                
                <div id="admin-projects-grid" class="admin-grid">
                    <!-- Projects loaded here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="modal-overlay hidden">
        <div class="modal-content glass-card">
            <div class="modal-header">
                <h3 id="modal-title">Add New Project</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="project-form">
                <input type="hidden" id="project-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="p-title" required>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="p-status">
                            <option value="live">Live</option>
                            <option value="delivered">Delivered</option>
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>Description</label>
                        <textarea id="p-desc" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Project URL</label>
                        <input type="url" id="p-url">
                    </div>
                    <div class="form-group">
                        <label>Icon Class (FontAwesome)</label>
                        <input type="text" id="p-icon" placeholder="fas fa-rocket">
                    </div>
                    <div class="form-group full">
                        <label>Tags (Comma separated)</label>
                        <input type="text" id="p-tags" placeholder="HTML, CSS, JS">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/admin-script.js"></script>
</body>
</html>
